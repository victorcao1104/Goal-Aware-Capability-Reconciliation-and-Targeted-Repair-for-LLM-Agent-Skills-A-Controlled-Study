name: Reproduce recorded results

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # GitHub repeats the long repository name in the Windows checkout path.
    # Apply this to checkout's Git subprocesses, including pack-file creation.
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Use a short working checkout
        run: python -c "import io, os, subprocess, zipfile; from pathlib import Path; data = subprocess.check_output(['git', 'archive', '--format=zip', 'HEAD']); zipfile.ZipFile(io.BytesIO(data)).extractall(Path(os.environ['RUNNER_TEMP']) / 'gcr-source')"
      - name: Install pinned dependencies
        working-directory: ${{ runner.temp }}/gcr-source
        run: python -m pip install -r requirements.lock
      - name: Prepare test scratch directory
        working-directory: ${{ runner.temp }}/gcr-source
        run: python -c "from pathlib import Path; Path('work').mkdir(exist_ok=True)"
      - name: Deterministic unit tests
        working-directory: ${{ runner.temp }}/gcr-source
        run: python -m unittest discover -s tests
      - name: Recompute and compare all published summary fields and tables
        working-directory: ${{ runner.temp }}/gcr-source
        run: python -m scripts.reproduce --output "${{ runner.temp }}/gcr-reproduced"
      - name: Upstream repair v2 tests
        working-directory: ${{ runner.temp }}/gcr-source
        run: python -m unittest discover -s tests_v2
      - name: Replay v2 mechanism pilot without an API key
        working-directory: ${{ runner.temp }}/gcr-source
        run: python -m research_v2.reproduce
      - name: Multi-site dependency v3 tests
        working-directory: ${{ runner.temp }}/gcr-source
        run: python -m unittest discover -s tests_v3
      - name: Replay v3 adaptive study and complexity certificates
        working-directory: ${{ runner.temp }}/gcr-source
        run: python -m research_v3.reproduce
      - name: Independent authority v4 tests (no API calls)
        working-directory: ${{ runner.temp }}/gcr-source
        run: python -m unittest discover -s tests_v4
      - name: Verify prepared v4 fixtures (not model results)
        working-directory: ${{ runner.temp }}/gcr-source
        run: python -m research_v4.reproduce --prepared
      - name: Replay all measured v4 components and trajectories
        working-directory: ${{ runner.temp }}/gcr-source
        run: python -m research_v4.reproduce
      - name: Verify v4 reporting diagnostics and figure hashes
        working-directory: ${{ runner.temp }}/gcr-source
        run: python -m scripts.report_v4 --verify
