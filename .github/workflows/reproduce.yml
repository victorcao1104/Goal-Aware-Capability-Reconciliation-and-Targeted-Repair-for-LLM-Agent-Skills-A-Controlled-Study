name: Reproduce recorded results

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock
      - name: Prepare test scratch directory
        run: python -c "from pathlib import Path; Path('work').mkdir(exist_ok=True)"
      - name: Deterministic unit tests
        run: python -m unittest discover -s tests
      - name: Recompute and compare all published summary fields and tables
        run: python -m scripts.reproduce --output "${{ runner.temp }}/gcr-reproduced"
